[project]
name = "tap-card-backend"
version = "0.1.0"
description = "Tap Card API — FastAPI backend for digital business cards"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
